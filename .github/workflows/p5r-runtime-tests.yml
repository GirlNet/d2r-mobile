# 无游戏内容的 macOS 宿主测试；不构建或上传 P5R 安装包。
# macOS host tests without game content; does not build or upload a P5R install package.
name: P5R runtime components
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/p5r-runtime-tests.yml'
      - 'dm/host/**'
      - 'dm/ios/p5r/**'
      - 'dm/tools/p5r_pack.py'
      - 'dm/tools/test_p5r_pack.py'
      - 'dm/gfx/nvn/**'
      - 'dm/gfx/tools/dmsh_build.py'
      - 'dm/gfx/tools/dmsh_chain.py'
      - 'dm/gfx/tools/dmsh_xlate/**'
      - 'dm/tools/diagnose_p5r_shaders.py'
      - 'dm/tools/test_diagnose_p5r_shaders.py'
      - 'dm/tools/test_shader_query_audit.py'
      - 'dm/tools/maxwell_texture_audit.py'
      - 'dm/tools/test_maxwell_texture_audit.py'
      - 'dm/tools/p5r_reflection.py'
      - 'dm/tools/test_p5r_reflection.py'
      - 'dm/tools/maxwell_memory_audit.py'
      - 'dm/tools/test_maxwell_memory_audit.py'
      - 'dm/tools/nvn_handle_layout.py'
      - 'dm/tools/test_nvn_handle_layout.py'
      - 'dm/tools/test_shader_buffer_reflection.py'
      - 'dm/tools/prepare_p5r_shaders.py'
      - 'dm/tools/test_prepare_p5r_shaders.py'
      - 'dm/tools/inspect_exefs.py'
      - 'dm/tools/prepare_port.py'
      - 'dm/tools/test_inspect_exefs.py'
      - 'dm/verify/equiv_compare.py'
      - 'dm/verify/test_equiv_compare.py'
      - 'dm/i18n/**'
permissions:
  contents: read
jobs:
  ios-shell:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate shader cache version from this checkout
        run: python3 dm/gfx/tools/dmsh_chain.py --header
      - name: Link and package the complete game-free P5R host
        run: |
          set -euo pipefail
          xcrun clang -DDM_P5R_ONLY=1 dm/host/tests/t_guest_bootstrap.c dm/host/guest_bootstrap.c -o "$RUNNER_TEMP/p5r-profile"
          "$RUNNER_TEMP/p5r-profile" p5r
          python3 -m unittest discover -s dm/tools -p test_p5r_pack.py -v
          python3 dm/ios/p5r/build_shell.py "$RUNNER_TEMP/p5r-shell"
      - name: Retain unsigned shell and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5r-ios-shell
          path: |
            ${{ runner.temp }}/p5r-shell/*.ipa
            ${{ runner.temp }}/p5r-shell/build-report.json
            ${{ runner.temp }}/p5r-shell/logs
          retention-days: 7
  macos-components:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate shader cache version from this checkout
        run: python3 dm/gfx/tools/dmsh_chain.py --header
      - name: Check changed host sources
        run: |
          set -euo pipefail
          xcrun clang -fsyntax-only -Werror=implicit-function-declaration -I dm/host -I dm/gfx/nvn/include \
            dm/host/guest_bootstrap.c dm/host/main.c dm/host/loader.c dm/host/hle.c \
            dm/host/hle_hid.c dm/host/hle_fs.c dm/host/hle_oe.c dm/host/hle_svc.c \
            dm/host/hle_audio.c dm/host/hle_misc.c
      - name: Run bootstrap and audio tests
        env:
          DM_AUDIO: '0'
        run: |
          set -euo pipefail
          make -C dm/host/tests build/t_guest_bootstrap build/t_audio build/t_audio_spsc build/t_shader_control build/t_nvn_handles build/t_nvn_buffers build/t_nvn_combined_refl build/t_nvn_compute_gpu build/t_nvn_texture_gpu
          dm/host/tests/build/t_guest_bootstrap d2r
          dm/host/tests/build/t_guest_bootstrap p5r
          dm/host/tests/build/t_audio
          dm/host/tests/build/t_audio_spsc
          dm/host/tests/build/t_shader_control
          dm/host/tests/build/t_nvn_handles
          dm/host/tests/build/t_nvn_buffers
          dm/host/tests/build/t_nvn_combined_refl
      - name: Run synthetic compute on an available Metal device
        run: |
          set +e
          dm/host/tests/build/t_nvn_compute_gpu
          result=$?
          if [ "$result" -eq 77 ]; then
            echo '::warning::Synthetic compute GPU execution skipped: runner has no Metal device.'
            exit 0
          fi
          exit "$result"
      - name: Check initialization probe persistence and stop boundaries
        run: |
          set -euo pipefail
          xcrun clang -DDM_P5R_ONLY=1 -fobjc-arc -fblocks -Wall -Wextra -Werror -I dm/host \
            dm/host/tests/t_boot_probe.m dm/ios/p5r/boot_probe.m -framework Foundation -o "$RUNNER_TEMP/p5r-boot-probe-test"
          for mode in checkpoint blocked timeout failure; do
            "$RUNNER_TEMP/p5r-boot-probe-test" "$mode" "$RUNNER_TEMP/p5r-probe-$mode"
          done
      - name: Run synthetic texture bindings on Metal 3 and 4
        run: |
          set +e
          dm/host/tests/build/t_nvn_texture_gpu
          result=$?
          if [ "$result" -eq 77 ]; then
            echo '::warning::Synthetic texture GPU execution skipped: runner has no Metal device.'
            exit 0
          fi
          if [ "$result" -eq 78 ]; then
            echo '::warning::Metal 3 texture GPU checks passed; Metal 4 execution skipped because this device does not support it.'
            exit 0
          fi
          exit "$result"
      - name: Compile changed Metal backend
        run: |
          set -euo pipefail
          xcrun clang -fobjc-arc -mmacosx-version-min=26.0 -Werror=implicit-function-declaration \
            -I dm/host -I dm/gfx/nvn/include -c dm/gfx/nvn/nvn_mtl.m -o "$RUNNER_TEMP/p5r-nvn-macos.o"
          xcrun --sdk iphoneos clang -arch arm64 -fobjc-arc -miphoneos-version-min=26.0 \
            -Werror=implicit-function-declaration -I dm/host -I dm/gfx/nvn/include \
            -c dm/gfx/nvn/nvn_mtl.m -o "$RUNNER_TEMP/p5r-nvn-ios.o"
          xcrun clang -Werror=implicit-function-declaration -I dm/host -I dm/gfx/nvn/include \
            -c dm/gfx/nvn/hle_nvn.c -o "$RUNNER_TEMP/p5r-hle-nvn-macos.o"
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=26.0 \
            -Werror=implicit-function-declaration -I dm/host -I dm/gfx/nvn/include \
            -c dm/gfx/nvn/hle_nvn.c -o "$RUNNER_TEMP/p5r-hle-nvn-ios.o"
      - name: Compile changed host components for iOS
        run: |
          set -euo pipefail
          xcrun --sdk iphoneos --show-sdk-version
          mkdir -p "$RUNNER_TEMP/p5r-ios-objects"
          for source in dm/host/guest_bootstrap.c dm/host/main.c dm/host/loader.c dm/host/hle.c \
            dm/host/hle_hid.c dm/host/hle_fs.c dm/host/hle_oe.c dm/host/hle_svc.c \
            dm/host/hle_audio.c dm/host/hle_misc.c; do
            xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=26.0 \
              -Werror=implicit-function-declaration -I dm/host -I dm/gfx/nvn/include \
              -c "$source" -o "$RUNNER_TEMP/p5r-ios-objects/${source##*/}.o"
          done
      - name: Ensure Apple Metal compiler is available
        run: |
          set -euo pipefail
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent metalToolchain
          fi
          xcrun -sdk macosx metal --version
          xcrun -sdk iphoneos metal --version
      - name: Run Python tool tests
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/p5r-tests"
          "$RUNNER_TEMP/p5r-tests/bin/python" -m pip install lz4==4.4.5
          "$RUNNER_TEMP/p5r-tests/bin/python" -m unittest discover -s dm/tools -p test_inspect_exefs.py -v
          "$RUNNER_TEMP/p5r-tests/bin/python" -m unittest discover -s dm/tools -p test_prepare_p5r_shaders.py -v
          "$RUNNER_TEMP/p5r-tests/bin/python" -m unittest discover -s dm/tools -p test_diagnose_p5r_shaders.py -v
          "$RUNNER_TEMP/p5r-tests/bin/python" -m unittest discover -s dm/tools -p test_p5r_reflection.py -v
          "$RUNNER_TEMP/p5r-tests/bin/python" -m unittest discover -s dm/tools -p test_maxwell_memory_audit.py -v
          "$RUNNER_TEMP/p5r-tests/bin/python" -m unittest discover -s dm/tools -p test_maxwell_texture_audit.py -v
          "$RUNNER_TEMP/p5r-tests/bin/python" -m unittest discover -s dm/tools -p test_nvn_handle_layout.py -v
          "$RUNNER_TEMP/p5r-tests/bin/python" -m unittest discover -s dm/tools -p test_shader_buffer_reflection.py -v
          "$RUNNER_TEMP/p5r-tests/bin/python" -m unittest discover -s dm/verify -p test_equiv_compare.py -v
          "$RUNNER_TEMP/p5r-tests/bin/python" -m unittest discover -s dm/i18n -p test_scan_literals.py -v
          "$RUNNER_TEMP/p5r-tests/bin/python" dm/i18n/scan_literals.py
          "$RUNNER_TEMP/p5r-tests/bin/python" dm/ios/tools/dm_i18n.py --check
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile translator and test synthetic Maxwell code
        run: |
          set -euo pipefail
          dotnet publish dm/gfx/tools/dmsh_xlate/dmsh_xlate.csproj -c Release -o "$RUNNER_TEMP/p5r-translator" --nologo
          P5R_TRANSLATOR="$RUNNER_TEMP/p5r-translator/dmsh_xlate" "$RUNNER_TEMP/p5r-tests/bin/python" -m unittest discover -s dm/tools -p test_maxwell_memory_audit.py -v
          P5R_TRANSLATOR="$RUNNER_TEMP/p5r-translator/dmsh_xlate" "$RUNNER_TEMP/p5r-tests/bin/python" -m unittest discover -s dm/tools -p test_shader_query_audit.py -v

# 无游戏内容的 macOS 宿主测试；不构建或上传 P5R 安装包。
# macOS host tests without game content; does not build or upload a P5R install package.
name: P5R runtime components
on:
  workflow_dispatch:
    inputs:
      metal_backend:
        description: Metal backend for the unsigned iOS host
        type: choice
        default: '4'
        options: ['4', '3']
  pull_request:
    paths:
      - '.github/workflows/p5r-runtime-tests.yml'
      - 'dm/host/**'
      - 'dm/ios/p5r/**'
      - 'dm/tools/audit_p5r_api.py'
      - 'dm/tools/p5r_pack.py'
      - 'dm/tools/test_p5r_pack.py'
      - 'dm/tools/test_hle_registration.py'
      - 'dm/gfx/nvn/**'
      - 'dm/gfx/tests/**'
      - 'dm/gfx/tex/**'
      - 'dm/gfx/tools/dmsh_build.py'
      - 'dm/gfx/tools/dmsh_chain.py'
      - 'dm/gfx/tools/dmsh_xlate/**'
      - 'dm/tools/diagnose_p5r_shaders.py'
      - 'dm/tools/test_diagnose_p5r_shaders.py'
      - 'dm/tools/test_shader_query_audit.py'
      - 'dm/tools/maxwell_texture_audit.py'
      - 'dm/tools/test_maxwell_texture_audit.py'
      - 'dm/tools/p5r_reflection.py'
      - 'dm/tools/test_p5r_reflection.py'
      - 'dm/tools/stage_p5r_shaders.py'
      - 'dm/tools/test_stage_p5r_shaders.py'
      - 'dm/tools/p5r_runtime_policy.py'
      - 'dm/tools/test_p5r_runtime_policy.py'
      - 'dm/tools/maxwell_memory_audit.py'
      - 'dm/tools/test_maxwell_memory_audit.py'
      - 'dm/tools/nvn_handle_layout.py'
      - 'dm/tools/test_nvn_handle_layout.py'
      - 'dm/tools/test_shader_buffer_reflection.py'
      - 'dm/tools/prepare_p5r_shaders.py'
      - 'dm/tools/test_prepare_p5r_shaders.py'
      - 'dm/tools/cpk_reader.py'
      - 'dm/tools/crilayla.py'
      - 'dm/tools/test_cpk_reader.py'
      - 'dm/tools/test_crilayla.py'
      - 'dm/tools/inspect_exefs.py'
      - 'dm/tools/prepare_port.py'
      - 'dm/tools/test_inspect_exefs.py'
      - 'dm/verify/equiv_compare.py'
      - 'dm/verify/test_equiv_compare.py'
      - 'dm/i18n/**'
permissions:
  contents: read
concurrency:
  group: p5r-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  control-editor:
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check normalized layouts and stale diagnostic config rejection
        run: |
          xcrun clang -Wall -Wextra -Werror dm/ios/p5r/t_pad_layout.c -o "$RUNNER_TEMP/pad-layout"
          "$RUNNER_TEMP/pad-layout"
          xcrun clang -Wall -Wextra -Werror dm/ios/p5r/t_camera_swipe.c -o "$RUNNER_TEMP/camera-swipe"
          "$RUNNER_TEMP/camera-swipe"
      - name: Verify actual phone and tablet controls and render editor previews
        run: python3 dm/ios/p5r/test_pad_preview.py "$RUNNER_TEMP/pad-preview"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p5r-control-editor
          path: ${{ runner.temp }}/pad-preview
  ios-shell:
    # The iPhone executable is explicitly cross-compiled with -arch arm64.
    # Keep packaging available when the hosted Apple Silicon pool is full.
    runs-on: macos-26-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate shader cache version from this checkout
        run: python3 dm/gfx/tools/dmsh_chain.py --header
      - name: Check application active time on the packaging host
        run: |
          set -euo pipefail
          make -C dm/host/tests build/t_oe
          dm/host/tests/build/t_oe
      - name: Check movie codec registration on the packaging host
        run: |
          set -euo pipefail
          make -C dm/host/tests build/t_movie_codecs
          dm/host/tests/build/t_movie_codecs p5r
          dm/host/tests/build/t_movie_codecs d2r
      - name: Decode real synthetic VP9 packets and check movie buffer protocol
        run: |
          set -euo pipefail
          make -C dm/host/tests build/t_p5r_movie build/t_vp9_decode
          dm/host/tests/build/t_p5r_movie p5r
          dm/host/tests/build/t_p5r_movie d2r
          dm/host/tests/build/t_vp9_decode dm/host/tests/fixtures/vp9-colours.ivf
      - name: Link and package the complete game-free P5R host
        run: |
          set -euo pipefail
          xcrun clang -fobjc-arc -fblocks -framework Foundation dm/ios/p5r/resources.m dm/ios/p5r/t_resources.m -o "$RUNNER_TEMP/p5r-resources-test"
          "$RUNNER_TEMP/p5r-resources-test"
          xcrun clang -DDM_P5R_ONLY=1 dm/host/tests/t_guest_bootstrap.c dm/host/guest_bootstrap.c -o "$RUNNER_TEMP/p5r-profile"
          "$RUNNER_TEMP/p5r-profile" p5r
          python3 -m unittest discover -s dm/tools -p test_p5r_pack.py -v
          python3 -m unittest discover -s dm/tools -p test_hle_registration.py -v
          python3 -m unittest discover -s dm/ios/p5r -p test_build_policy.py -v
          python3 dm/ios/p5r/build_shell.py "$RUNNER_TEMP/p5r-shell" --metal-backend "${{ inputs.metal_backend || '4' }}"
      - name: Retain unsigned shell and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5r-ios-shell
          path: |
            ${{ runner.temp }}/p5r-shell/*.ipa
            ${{ runner.temp }}/p5r-shell/build-report.json
            ${{ runner.temp }}/p5r-shell/logs
          retention-days: 7
  linear-storage-gpu:
    # 独立验证共享线性存储，避免 macOS 26 运行器排队阻塞基础 GPU 像素回归。
    # Validate shared linear storage independently so macOS 26 runner queues do not block basic GPU pixel regressions.
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify player yield and condition-variable paths without observation
        run: |
          set -euo pipefail
          for diagnostics in 0 1; do
            xcrun clang -O1 -Wno-unused-function -DDM_RUNTIME_DIAGNOSTICS="$diagnostics" -I dm/host \
              dm/host/tests/t_player_yield.c dm/host/hle_thread.c -o "$RUNNER_TEMP/yield-$diagnostics"
            "$RUNNER_TEMP/yield-$diagnostics"
          done
          xcrun clang -O1 -Wno-unused-function -DDM_RUNTIME_DIAGNOSTICS=0 -DDM_TEST_HOOKS -I dm/host \
            dm/host/tests/t_condvar.c dm/host/tests/t_condvar_stub.c dm/host/hle_thread.c -o "$RUNNER_TEMP/condvar-player"
          "$RUNNER_TEMP/condvar-player"
      - name: Verify player dirty-page protection without diagnostic counters
        run: |
          set -euo pipefail
          make -C dm/gfx/tests t_dirty_slots t_dirty_race CFLAGS='-O1 -g -Wall -Wno-unused-function -DDM_RUNTIME_DIAGNOSTICS=0 -I../nvn/include'
          dm/gfx/tests/t_dirty_slots
          dm/gfx/tests/t_dirty_race
      - name: Select an available Xcode 26 SDK
        run: |
          sdk=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -type d | sort | tail -1)
          if [ -n "$sdk" ]; then echo "DEVELOPER_DIR=$sdk/Contents/Developer" >> "$GITHUB_ENV"; fi
      - name: Verify glyph, BGRA8 UI and R32F GPU CPU shared storage on Apple Silicon
        run: |
          set -euo pipefail
          python3 dm/gfx/tools/dmsh_chain.py --header
          make -C dm/gfx/tests t_linear_glyph_gpu t_linear_float_gpu
          MTL_DEBUG_LAYER=1 dm/gfx/tests/t_linear_glyph_gpu
          MTL_DEBUG_LAYER=1 dm/gfx/tests/t_linear_float_gpu
      - name: Verify center dialogue survives the stereo output callback
        run: |
          set -euo pipefail
          make -C dm/host/tests build/t_audio_mix build/t_audio build/t_audio_spsc
          dm/host/tests/build/t_audio_mix
          dm/host/tests/build/t_audio
          dm/host/tests/build/t_audio_spsc
      - name: Verify color feedback snapshots preserve distortion backgrounds
        run: |
          set -euo pipefail
          make -C dm/gfx/tests t_color_feedback_gpu
          MTL_DEBUG_LAYER=1 dm/gfx/tests/t_color_feedback_gpu
      - name: Verify exact floating-point helper inlining through production source compilation
        run: |
          set -euo pipefail
          make -C dm/gfx/tests t_shader_math_gpu
          MTL_DEBUG_LAYER=1 dm/gfx/tests/t_shader_math_gpu
  macos-components:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate shader cache version from this checkout
        run: python3 dm/gfx/tools/dmsh_chain.py --header
      - name: Verify CPU-updated glyph and BGRA8 UI textures share guest storage
        run: |
          set -euo pipefail
          make -C dm/gfx/tests t_linear_glyph_gpu t_linear_glyph_gpu_m4
          MTL_DEBUG_LAYER=1 dm/gfx/tests/t_linear_glyph_gpu
          python3 - <<'PY'
          import os,subprocess
          result=subprocess.run(['dm/gfx/tests/t_linear_glyph_gpu_m4'],env=dict(os.environ,MTL_DEBUG_LAYER='1'))
          if result.returncode in (77,78):
              print('::warning::Metal 4 linear glyph execution unavailable')
          elif result.returncode:
              raise SystemExit(result.returncode)
          PY
      - name: Verify linear R32F render targets expose GPU depth writes to the CPU
        run: |
          set -euo pipefail
          make -C dm/gfx/tests t_linear_float_gpu t_linear_float_gpu_m4
          MTL_DEBUG_LAYER=1 dm/gfx/tests/t_linear_float_gpu
          python3 - <<'PY'
          import os,subprocess
          result=subprocess.run(['dm/gfx/tests/t_linear_float_gpu_m4'],env=dict(os.environ,MTL_DEBUG_LAYER='1'))
          if result.returncode in (77,78):
              print('::warning::Metal 4 linear float execution unavailable')
          elif result.returncode:
              raise SystemExit(result.returncode)
          PY
      - name: Verify sampled color attachments use independent ordered snapshots
        run: |
          set -euo pipefail
          make -C dm/gfx/tests t_color_feedback_gpu t_color_feedback_gpu_m4
          MTL_DEBUG_LAYER=1 dm/gfx/tests/t_color_feedback_gpu
          python3 - <<'PY'
          import os,subprocess
          result=subprocess.run(['dm/gfx/tests/t_color_feedback_gpu_m4'],env=dict(os.environ,MTL_DEBUG_LAYER='1'))
          if result.returncode in (77,78):
              print('::warning::Metal 4 color feedback execution unavailable')
          elif result.returncode:
              raise SystemExit(result.returncode)
          PY
      - name: Check application active time, environment and exit-request sections
        run: |
          set -euo pipefail
          make -C dm/host/tests build/t_oe
          dm/host/tests/build/t_oe
      - name: Check movie codec registration and ownership
        run: |
          set -euo pipefail
          make -C dm/host/tests build/t_movie_codecs
          dm/host/tests/build/t_movie_codecs p5r
          dm/host/tests/build/t_movie_codecs d2r
      - name: Decode VP9 key and inter frames through public Apple APIs
        run: |
          set -euo pipefail
          make -C dm/host/tests build/t_p5r_movie build/t_vp9_decode
          dm/host/tests/build/t_p5r_movie p5r
          dm/host/tests/build/t_p5r_movie d2r
          dm/host/tests/build/t_vp9_decode dm/host/tests/fixtures/vp9-colours.ivf
      - name: Audit registered startup API coverage
        run: python3 dm/tools/audit_p5r_api.py
      - name: Check changed host sources
        run: |
          set -euo pipefail
          xcrun clang -fsyntax-only -Werror=implicit-function-declaration -I dm/host -I dm/gfx/nvn/include \
            dm/host/guest_bootstrap.c dm/host/main.c dm/host/loader.c dm/host/hle.c \
            dm/host/hle_hid.c dm/host/hle_fs.c dm/host/hle_oe.c dm/host/hle_svc.c dm/host/hle_cache.c \
            dm/host/hle_audio.c dm/host/hle_misc.c
      - name: Run bootstrap and audio tests
        env:
          DM_AUDIO: '0'
        run: |
          set -euo pipefail
          make -C dm/host/tests build/t_guest_bootstrap build/t_audio_mix build/t_audio build/t_audio_spsc build/t_shader_control build/t_nvn_handles build/t_nvn_buffers build/t_nvn_combined_refl build/t_nvn_compute_gpu build/t_nvn_texture_gpu
          dm/host/tests/build/t_guest_bootstrap d2r
          dm/host/tests/build/t_guest_bootstrap p5r
          dm/host/tests/build/t_audio
          dm/host/tests/build/t_audio_mix
          dm/host/tests/build/t_audio_spsc
          dm/host/tests/build/t_shader_control
          dm/host/tests/build/t_nvn_handles
          dm/host/tests/build/t_nvn_buffers
          dm/host/tests/build/t_nvn_combined_refl
      - name: Verify stencil loads preserve guest register bits
        run: |
          set -euo pipefail
          xcrun clang -Wall -Wextra -Werror dm/gfx/tests/t_texture_bits.c dm/gfx/nvn/nvn_texture_bits.c -o "$RUNNER_TEMP/texture-bits"
          "$RUNNER_TEMP/texture-bits"
          make -C dm/gfx/tests t_stencil_load_gpu t_stencil_load_gpu_m4
          python3 - <<'PY'
          import os,subprocess
          env=dict(os.environ,MTL_DEBUG_LAYER='1')
          for name in ('t_stencil_load_gpu','t_stencil_load_gpu_m4'):
              result=subprocess.run(['dm/gfx/tests/'+name],capture_output=True,text=True,env=env)
              print(result.stdout,result.stderr)
              if result.returncode in (77,78):
                  print('::warning::Stencil load GPU execution unavailable: '+name)
                  continue
              if result.returncode or 'STENCIL LOAD GPU OK:' not in result.stdout:
                  raise SystemExit('Stencil load GPU regression failed: '+name)
              if 'TEXTURE PREPARATION GPU OK:' not in result.stdout:
                  raise SystemExit('On-demand view upgrade/readback did not execute: '+name)
              bad=subprocess.run(['dm/gfx/tests/'+name,'--sample'],capture_output=True,text=True,env=env)
              if bad.returncode>=0 or 'Integer texture requires direct loads' not in bad.stdout+bad.stderr:
                  raise SystemExit('Unsupported integer sampling was not rejected: '+bad.stdout+bad.stderr)
              print(name+': unsupported integer sampling rejected before dispatch')
          PY
      - name: Check NVN bootstrap without GPU work
        run: |
          set -euo pipefail
          make -C dm/gfx/tests t_nvn
          dm/gfx/tests/t_nvn --bootstrap-only
          make -C dm/gfx/tests t_nvn_gpu_setup
          dm/gfx/tests/t_nvn_gpu_setup --queue-sync-gpu
          xcrun clang -Wall -Wextra -Werror dm/gfx/tests/t_copy_layout.c -o "$RUNNER_TEMP/copy-layout"
          "$RUNNER_TEMP/copy-layout"
          dm/gfx/tests/t_nvn_gpu_setup --copy-image-stride-gpu
          dm/gfx/tests/t_nvn_gpu_setup --clear-buffer-gpu
          dm/gfx/tests/t_nvn_gpu_setup --signed-texture-clear-gpu
          make -C dm/gfx/tests t_shader_math_gpu
          dm/gfx/tests/t_shader_math_gpu
          make -C dm/gfx/tests t_depth_clamp_gpu
          dm/gfx/tests/t_depth_clamp_gpu
          make -C dm/gfx/tests t_viewport_batch_gpu
          MTL_DEBUG_LAYER=1 dm/gfx/tests/t_viewport_batch_gpu
          python3 - <<'PY'
          import subprocess
          for flag,reason in (('--nonuniform-scissors','SetScissors nonuniform'),('--nonuniform-depth','SetDepthRanges nonuniform'),('--nonzero-scissor','SetScissors nonzero'),('--invalid-count','SetScissors invalid'),('--null-range','SetDepthRanges invalid')):
              result=subprocess.run(['dm/gfx/tests/t_viewport_batch_gpu',flag],capture_output=True,text=True)
              if result.returncode>=0 or reason not in result.stderr:
                  raise SystemExit('Viewport batch rejection failed: '+flag+' '+result.stdout+result.stderr)
          print('VIEWPORT BATCH REJECTION OK: five unsupported/invalid inputs rejected')
          PY
          make -C dm/gfx/tests t_primitive_restart_gpu
          dm/gfx/tests/t_primitive_restart_gpu
          xcrun clang -Wall -Wextra -Werror dm/gfx/tests/t_vertex_bits.c dm/gfx/nvn/nvn_vertex_bits.c -o "$RUNNER_TEMP/vertex-bits"
          "$RUNNER_TEMP/vertex-bits"
          make -C dm/gfx/tests t_vertex_fetch_gpu
          dm/gfx/tests/t_vertex_fetch_gpu
          xcrun clang -Wall -Wextra -Werror dm/gfx/tests/t_fragment_bits.c dm/gfx/nvn/nvn_fragment_bits.c -o "$RUNNER_TEMP/fragment-bits"
          "$RUNNER_TEMP/fragment-bits"
          make -C dm/gfx/tests t_fragment_export_gpu
          dm/gfx/tests/t_fragment_export_gpu
          make -C dm/gfx/tests t_raster_discard_gpu
          dm/gfx/tests/t_raster_discard_gpu
          make -C dm/gfx/tests t_downsample_gpu
          dm/gfx/tests/t_downsample_gpu
          make -C dm/gfx/tests t_copy_draw_gpu
          dm/gfx/tests/t_copy_draw_gpu
          make -C dm/gfx/tests t_shader_scratch_gpu
          dm/gfx/tests/t_shader_scratch_gpu
      - name: Verify isolated P5R render-pass continuation and full attachment stores
        run: |
          set -euo pipefail
          make -C dm/gfx/tests t_p5r_rt_continue_gpu t_p5r_rt_continue_gpu_m4
          python3 - <<'PY'
          import os, subprocess
          for backend in ('', '_m4'):
              for mode in ('unset', '0', '1', 'both'):
                  env = dict(os.environ, MTL_DEBUG_LAYER='1')
                  env.pop('DM_P5R_RT_CONTINUE', None)
                  env.pop('DM_P5R_TBDR', None)
                  if mode != 'unset':
                      env['DM_P5R_RT_CONTINUE'] = '1' if mode == 'both' else mode
                  if mode == 'both':
                      env['DM_P5R_TBDR'] = '1'
                  result = subprocess.run(['dm/gfx/tests/t_p5r_rt_continue_gpu' + backend], env=env)
                  if backend and result.returncode in (77, 78):
                      print('::warning::Metal 4 P5R continuation execution unavailable')
                      break
                  if result.returncode:
                      raise SystemExit(result.returncode)
          PY
      - name: Verify default-off compute comparisons and fallback guards
        run: |
          set -euo pipefail
          make -C dm/gfx/tests t_compute_probe_gpu t_compute_probe_gpu_m4
          python3 - <<'PY'
          import os,subprocess
          for suffix in ('','_m4'):
              for flag in ('','--disabled-no-config','--missing','--bad-original','--bad-candidate','--bad-entry','--bad-layout','--oversize'):
                  argv=['dm/gfx/tests/t_compute_probe_gpu'+suffix]+([flag] if flag else [])
                  r=subprocess.run(argv,capture_output=True,text=True,env=dict(os.environ,MTL_DEBUG_LAYER='1'))
                  print(r.stdout,r.stderr)
                  if r.returncode in (77,78):
                      print('::warning::Compute comparison GPU execution unavailable for '+(suffix or 'Metal 3'))
                      break
                  if r.returncode or 'COMPUTE PROBE GPU OK:' not in r.stdout:raise SystemExit('Compute comparison failed: '+str(argv))
          PY
      - name: Verify buffer compute batching and exact baseline parity
        run: |
          set -euo pipefail
          make -C dm/gfx/tests t_compute_batch_gpu t_compute_batch_gpu_m4
          python3 - <<'PY'
          import os,subprocess
          for suffix in ('','_m4'):
              r=subprocess.run(['dm/gfx/tests/t_compute_batch_gpu'+suffix],capture_output=True,text=True,env=dict(os.environ,MTL_DEBUG_LAYER='1'))
              print(r.stdout,r.stderr)
              if r.returncode in (77,78):
                  print('::warning::Compute batching GPU execution unavailable for '+(suffix or 'Metal 3'))
                  continue
              if r.returncode or 'COMPUTE BATCH GPU OK:' not in r.stdout:
                  raise SystemExit('Compute batch GPU regression failed')
          PY
      - name: Verify continuous command families, synchronization and instance IDs
        run: |
          set -euo pipefail
          make -C dm/gfx/tests t_command_sequence_gpu t_command_sequence_gpu_m4
          python3 - <<'PY'
          import os,subprocess
          env=dict(os.environ,MTL_DEBUG_LAYER='1')
          for binary in ('t_command_sequence_gpu','t_command_sequence_gpu_m4'):
              result=subprocess.run(['dm/gfx/tests/'+binary],capture_output=True,text=True,env=env)
              print(result.stdout,result.stderr)
              if result.returncode in (77,78) and binary.endswith('_m4'):
                  print('::warning::Metal 4 continuous sequence execution unavailable')
                  continue
              if result.returncode or 'COMMAND SEQUENCE GPU OK:' not in result.stdout:
                  raise SystemExit('Continuous command sequence failed: '+binary)
          for flag,reason in (('--bad-instances','Invalid array instance'),('--bad-point','Invalid dynamic raster'),('--bad-sync','sync object/device mismatch'),('--long-label','debug label exceeds'),('--wide-line','Wide lines unsupported'),('--point-size','point size unsupported'),('--subpixel','subpixel precision unsupported'),('--swizzle','viewport swizzle unsupported'),('--report-range','ReportValue destination invalid')):
              result=subprocess.run(['dm/gfx/tests/t_command_sequence_gpu',flag],capture_output=True,text=True,env=env)
              if result.returncode>=0 or reason not in result.stderr:
                  raise SystemExit('Command sequence rejection failed: '+flag+' '+result.stdout+result.stderr)
          print('COMMAND SEQUENCE REJECTIONS OK: nine unsupported/invalid cases')
          PY
      - name: Verify concurrent queue ownership and persistent state
        run: |
          set -euo pipefail
          make -C dm/gfx/tests t_queue_concurrency_gpu t_queue_concurrency_gpu_m4
          python3 - <<'PY'
          import os,subprocess
          env=dict(os.environ,MTL_DEBUG_LAYER='1')
          for binary in ('t_queue_concurrency_gpu','t_queue_concurrency_gpu_m4'):
              for options in ([],['--legacy-visibility']):
                  result=subprocess.run(['dm/gfx/tests/'+binary,*options],capture_output=True,text=True,env=env,timeout=120)
                  print(result.stdout,result.stderr)
                  if result.returncode in (77,78) and binary.endswith('_m4'):
                      print('::warning::Metal 4 concurrent queue execution unavailable')
                      break
                  if result.returncode or 'QUEUE CONCURRENCY GPU OK:' not in result.stdout or 'VISIBILITY PREFIX GPU OK:' not in result.stdout:
                      raise SystemExit('Concurrent queue regression failed: '+binary)
                  if not options and 'ASYNC VISIBILITY SUBMIT OK:' not in result.stdout:
                      raise SystemExit('Visibility submit must return before the GPU is unblocked')
          result=subprocess.run(['dm/gfx/tests/t_queue_concurrency_gpu','--recursive-api'],capture_output=True,text=True,timeout=10)
          if result.returncode>=0 or 'Recursive NVN queue API' not in result.stderr:
              raise SystemExit('Recursive queue API must reject promptly, without deadlock')
          print('QUEUE API RECURSION REJECTION OK')
          PY
      - name: Verify optional bounded Metal 4 GPU timestamps preserve public command output
        run: |
          set -euo pipefail
          make -C dm/gfx/tests t_passgpu_m4
          python3 - <<'PY'
          import os,subprocess
          result=subprocess.run(['dm/gfx/tests/t_passgpu_m4'],capture_output=True,text=True,
                                env=dict(os.environ,MTL_DEBUG_LAYER='1'),timeout=120)
          print(result.stdout,result.stderr)
          if result.returncode in (77,78,79):
              print('::warning::Metal 4 timestamp execution unavailable; compilation and separate pixel regressions still required')
          elif result.returncode or 'PASSGPU4 GPU OK:' not in result.stdout:
              raise SystemExit('Metal 4 timestamp regression failed')
          PY
      - name: Verify conditional draws, clears and query ordering on Metal 3
        run: |

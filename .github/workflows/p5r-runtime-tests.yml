# 无游戏内容的 macOS 宿主测试；不构建或上传 P5R 安装包。
# macOS host tests without game content; does not build or upload a P5R install package.
name: P5R runtime components
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/p5r-runtime-tests.yml'
      - 'dm/host/**'
      - 'dm/gfx/nvn/**'
      - 'dm/tools/prepare_p5r_shaders.py'
      - 'dm/tools/test_prepare_p5r_shaders.py'
      - 'dm/tools/inspect_exefs.py'
      - 'dm/tools/prepare_port.py'
      - 'dm/tools/test_inspect_exefs.py'
      - 'dm/verify/equiv_compare.py'
      - 'dm/verify/test_equiv_compare.py'
      - 'dm/i18n/**'
permissions:
  contents: read
jobs:
  macos-components:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check changed host sources
        run: |
          set -euo pipefail
          xcrun clang -fsyntax-only -Werror=implicit-function-declaration -I dm/host -I dm/gfx/nvn/include \
            dm/host/guest_bootstrap.c dm/host/main.c dm/host/loader.c dm/host/hle.c \
            dm/host/hle_hid.c dm/host/hle_fs.c dm/host/hle_oe.c dm/host/hle_svc.c \
            dm/host/hle_audio.c dm/host/hle_misc.c
      - name: Run bootstrap and audio tests
        env:
          DM_AUDIO: '0'
        run: |
          set -euo pipefail
          make -C dm/host/tests build/t_guest_bootstrap build/t_audio build/t_audio_spsc build/t_shader_control
          dm/host/tests/build/t_guest_bootstrap d2r
          dm/host/tests/build/t_guest_bootstrap p5r
          dm/host/tests/build/t_audio
          dm/host/tests/build/t_audio_spsc
          dm/host/tests/build/t_shader_control
      - name: Compile changed Metal backend
        run: |
          set -euo pipefail
          xcrun clang -fobjc-arc -mmacosx-version-min=26.0 -Werror=implicit-function-declaration \
            -I dm/host -I dm/gfx/nvn/include -c dm/gfx/nvn/nvn_mtl.m -o "$RUNNER_TEMP/p5r-nvn-macos.o"
          xcrun --sdk iphoneos clang -arch arm64 -fobjc-arc -miphoneos-version-min=26.0 \
            -Werror=implicit-function-declaration -I dm/host -I dm/gfx/nvn/include \
            -c dm/gfx/nvn/nvn_mtl.m -o "$RUNNER_TEMP/p5r-nvn-ios.o"
      - name: Compile changed host components for iOS
        run: |
          set -euo pipefail
          xcrun --sdk iphoneos --show-sdk-version
          mkdir -p "$RUNNER_TEMP/p5r-ios-objects"
          for source in dm/host/guest_bootstrap.c dm/host/main.c dm/host/loader.c dm/host/hle.c \
            dm/host/hle_hid.c dm/host/hle_fs.c dm/host/hle_oe.c dm/host/hle_svc.c \
            dm/host/hle_audio.c dm/host/hle_misc.c; do
            xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=26.0 \
              -Werror=implicit-function-declaration -I dm/host -I dm/gfx/nvn/include \
              -c "$source" -o "$RUNNER_TEMP/p5r-ios-objects/${source##*/}.o"
          done
      - name: Run Python tool tests
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/p5r-tests"
          "$RUNNER_TEMP/p5r-tests/bin/python" -m pip install lz4==4.4.5
          "$RUNNER_TEMP/p5r-tests/bin/python" -m unittest discover -s dm/tools -p test_inspect_exefs.py -v
          "$RUNNER_TEMP/p5r-tests/bin/python" -m unittest discover -s dm/tools -p test_prepare_p5r_shaders.py -v
          "$RUNNER_TEMP/p5r-tests/bin/python" -m unittest discover -s dm/verify -p test_equiv_compare.py -v
          "$RUNNER_TEMP/p5r-tests/bin/python" -m unittest discover -s dm/i18n -p test_scan_literals.py -v
          "$RUNNER_TEMP/p5r-tests/bin/python" dm/i18n/scan_literals.py
          "$RUNNER_TEMP/p5r-tests/bin/python" dm/ios/tools/dm_i18n.py --check
